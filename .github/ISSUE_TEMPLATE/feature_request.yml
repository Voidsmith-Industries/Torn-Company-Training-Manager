name: Feature request
description: Suggest an improvement to Company Training Manager
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Do not include secrets or private data.
    validations:
      required: true
