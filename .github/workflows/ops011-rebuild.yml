name: OPS011 temporary rebuild
on:
  push:
    branches: [ops011-security-hardening]
permissions:
  contents: write
jobs:
  rebuild:
    if: "!contains(github.event.head_commit.message, '[ops011-rebuild]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit regenerated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/Torn Company Training Manager.user.js"
          if git diff --cached --quiet; then
            echo "Bundle already current."
          else
            git commit -m "chore: refresh generated userscript [ops011-rebuild]"
            git push origin HEAD:ops011-security-hardening
          fi
