name: Verify and build userscript

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build userscript
        run: npm run build

      - name: Verify generated userscript is committed
        run: git diff --exit-code -- "dist/Torn Company Training Manager.user.js"

      - name: Upload test userscript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: training-manager-test-userscript
          path: "dist/Torn Company Training Manager.user.js"
          if-no-files-found: error
          retention-days: 7

      - name: Run tests
        run: npm test
